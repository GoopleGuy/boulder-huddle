name: Validate patched Node toolchain
on:
  pull_request:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx --no-install wrangler deploy --dry-run --outdir /tmp/huddle-worker-check
        env:
          WRANGLER_SEND_METRICS: 'false'
